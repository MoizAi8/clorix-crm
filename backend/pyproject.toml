[project]
name = "clorix-engine"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.135,<1",
    "pydantic>=2.12,<3",
    "psycopg[binary,pool]>=3.3,<4",
    "pyjwt>=2.12,<3",
    "tzdata>=2025.2",
    "reportlab>=4.4,<5",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pypdf>=6,<8",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
    "uvicorn>=0.40,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: opens the isolated PostgreSQL test database"]
