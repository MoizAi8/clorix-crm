name: Clorix checks

on:
  push:
    paths-ignore:
      - 'artifacts/**'
      - 'docs/**'
      - 'PROGRESS.md'
      - 'README.md'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: clorix_admin
          POSTGRES_PASSWORD: ci_fixture_admin
          POSTGRES_DB: clorix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clorix_admin -d clorix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DIRECT_DATABASE_URL: postgresql://clorix_admin:ci_fixture_admin@127.0.0.1:5432/clorix_test
      DATABASE_URL: postgresql://clorix_runtime:ci_fixture_runtime@127.0.0.1:5432/clorix_test
      TEST_DATABASE_URL: postgresql://clorix_runtime:ci_fixture_runtime@127.0.0.1:5432/clorix_test
      AUTH_SECRET: ci-auth-fixture-for-isolated-postgresql-only-2026
      DEMO_RATE_LIMIT_SECRET: ci-limit-fixture-for-isolated-postgresql-only-2026
      APP_URL: http://localhost:3000
      SANDBOX_IP_DAILY_LIMIT: 20
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: psql "$DIRECT_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE clorix_runtime LOGIN NOBYPASSRLS PASSWORD 'ci_fixture_runtime';"
      - run: npm run db:migrate && npm run db:admin -- grant && npm run test:db
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --project backend
      - run: uv run --project backend ruff check backend
      - name: Verify FastAPI security and cross-language integration
        env:
          CLORIX_ENGINE_DATABASE_URL: postgresql://clorix_engine:ci_fixture_engine@127.0.0.1:5432/clorix_test
          CLORIX_ENGINE_URL: http://127.0.0.1:8812/
          CLORIX_ENGINE_SIGNING_KEY: ci-engine-fixture-for-isolated-postgresql-only-2026
        run: |
          psql "$DIRECT_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE clorix_engine LOGIN NOBYPASSRLS PASSWORD 'ci_fixture_engine';"
          psql "$DIRECT_DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema/engine-grants.sql
          node scripts/test-engine.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify both services in a production-build browser
        env:
          CLORIX_ENGINE_DATABASE_URL: postgresql://clorix_engine:ci_fixture_engine@127.0.0.1:5432/clorix_test
          CLORIX_ENGINE_URL: http://127.0.0.1:8812/
          CLORIX_ENGINE_SIGNING_KEY: ci-engine-fixture-for-isolated-postgresql-only-2026
        run: node scripts/test-engine.mjs --browser
